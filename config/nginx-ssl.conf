# AI期货分析系统 - Nginx SSL 配置文件（HTTPS）
# 使用方式：配置 SSL 证书后使用此配置

upstream futures_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name _;  # 修改为实际域名
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;  # 修改为实际域名，如：futures.example.com
    
    # SSL 证书配置（使用 Let's Encrypt 或自签名证书）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # 日志配置
    access_log /var/log/nginx/futures_ai_access.log;
    error_log /var/log/nginx/futures_ai_error.log;
    
    # 客户端真实IP传递（重要）
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    
    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 限制请求体大小
    client_max_body_size 10M;
    
    # 超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # 静态文件服务
    location /static {
        alias /var/www/futures_ai/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # 静态文件压缩
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }
    
    # 图标文件
    location = /favicon.ico {
        alias /var/www/futures_ai/favicon.ico;
        expires 30d;
        access_log off;
    }
    
    # 主应用反向代理
    location / {
        proxy_pass http://futures_app;
        proxy_http_version 1.1;
        
        # 设置请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # WebSocket 支持（如需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓冲区设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # API 接口优化
    location /api/ {
        proxy_pass http://futures_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API 接口缓存控制（不缓存）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
    
    # 管理后台访问限制（可选）
    location /xwx422 {
        proxy_pass http://futures_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 可添加 IP 白名单限制
        # allow 192.168.1.0/24;
        # deny all;
    }
    
    # 健康检查端点
    location /health {
        proxy_pass http://futures_app/;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/futures_ai/static;
        internal;
    }
    
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(db|sqlite|sqlite3|env|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
