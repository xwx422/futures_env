# AI期货分析系统 - Nginx 配置文件
# 使用方式：复制到 /etc/nginx/sites-available/futures_ai 并创建软链接

upstream futures_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 修改为实际域名，如：futures.example.com
    
    # 日志配置
    access_log /var/log/nginx/futures_ai_access.log;
    error_log /var/log/nginx/futures_ai_error.log;
    
    # 客户端真实IP传递（重要）
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    
    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 限制请求体大小（用于数据导出等功能）
    client_max_body_size 10M;
    
    # 超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # 静态文件服务
    location /static {
        alias /var/www/futures_ai/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # 静态文件压缩
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }
    
    # 图标文件
    location = /favicon.ico {
        alias /var/www/futures_ai/favicon.ico;
        expires 30d;
        access_log off;
    }
    
    # 主应用反向代理
    location / {
        proxy_pass http://futures_app;
        proxy_http_version 1.1;
        
        # 设置请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # WebSocket 支持（如需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓冲区设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # API 接口优化
    location /api/ {
        proxy_pass http://futures_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API 接口缓存控制（不缓存）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
    
    # 管理后台访问限制（可选）
    location /xwx422 {
        proxy_pass http://futures_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 可添加 IP 白名单限制
        # allow 192.168.1.0/24;
        # deny all;
    }
    
    # 健康检查端点（如需要）
    location /health {
        proxy_pass http://futures_app/;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/futures_ai/static;
        internal;
    }
    
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(db|sqlite|sqlite3|env|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
